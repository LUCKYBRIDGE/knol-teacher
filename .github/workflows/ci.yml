name: KnolTeacher CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: knolteacher-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify:
    name: Build, test, and verify package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore KnolTeacher.sln

      - name: Build Release
        run: dotnet build KnolTeacher.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test tests/KnolTeacher.Tests/KnolTeacher.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=knolteacher-tests.trx"

      - name: Validate release notes contract
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content -LiteralPath "release/release-version.txt" -Raw).Trim()
          ./scripts/validate-user-facing-release-notes.ps1 -Version $releaseVersion

      - name: Validate single-file packaging policy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [xml]$project = Get-Content -LiteralPath "src/KnolTeacher.Desktop/KnolTeacher.Desktop.csproj" -Raw
          $compression = [string]$project.Project.PropertyGroup.EnableCompressionInSingleFile
          if ($compression -ne "true") {
              throw "EnableCompressionInSingleFile must remain true until a measured Windows startup benchmark justifies the package-size regression. Found: $compression"
          }

      - name: Publish official local single-file package
        shell: cmd
        run: publish.bat

      - name: Verify package shape, embedded version, and digest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          [xml]$props = Get-Content -LiteralPath "Directory.Build.props" -Raw
          $expectedVersion = [string]$props.Project.PropertyGroup.KnolTeacherVersion
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) {
              throw "KnolTeacherVersion is missing from Directory.Build.props."
          }

          $files = @(Get-ChildItem -LiteralPath "dist-net" -File -Recurse)
          if ($files.Count -ne 1) {
              throw "dist-net must contain exactly one file. Found: $($files.Count)"
          }

          $exe = $files[0]
          if ($exe.Name -ne "놀티쳐.exe") {
              throw "Official local package must be named 놀티쳐.exe. Found: $($exe.Name)"
          }

          $expectedFileVersion = "$expectedVersion.0"
          $actualFileVersion = $exe.VersionInfo.FileVersion
          if ($actualFileVersion -ne $expectedFileVersion) {
              throw "Embedded FileVersion mismatch. Expected $expectedFileVersion, found $actualFileVersion."
          }

          $actualProductVersion = $exe.VersionInfo.ProductVersion
          if (-not $actualProductVersion.StartsWith($expectedVersion, [System.StringComparison]::Ordinal)) {
              throw "Embedded ProductVersion mismatch. Expected prefix $expectedVersion, found $actualProductVersion."
          }

          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash.Length -ne 64) {
              throw "Invalid SHA-256 digest length."
          }

          Write-Host "Verified package: $($exe.Name)"
          Write-Host "Version: $actualFileVersion"
          Write-Host "SHA-256: $hash"

      - name: Upload verified CI executable
        uses: actions/upload-artifact@v4
        with:
          name: KnolTeacher-ci-${{ github.sha }}
          path: dist-net/놀티쳐.exe
          if-no-files-found: error
          retention-days: 7
