name: KnolTeacher v1.1 Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knolteacher-v1.1-rc-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  rc:
    name: Build and verify v1.1 RC
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Require main branch
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") {
              throw "Release Candidate builds must be dispatched from main. Current ref: ${{ github.ref }}"
          }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate RC version state
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [xml]$props = Get-Content -LiteralPath "Directory.Build.props" -Raw
          $developmentVersion = [string]$props.Project.PropertyGroup.KnolTeacherVersion
          $stableVersion = (Get-Content -LiteralPath "release/release-version.txt" -Raw).Trim()

          if ([string]::IsNullOrWhiteSpace($developmentVersion)) {
              throw "KnolTeacherVersion is missing from Directory.Build.props."
          }

          if ([version]$developmentVersion -le [version]$stableVersion) {
              throw "RC build requires a development version newer than the current Stable Release. Development=$developmentVersion Stable=$stableVersion"
          }

          Write-Host "Development version: $developmentVersion"
          Write-Host "Stable baseline: $stableVersion"

      - name: Restore
        run: dotnet restore KnolTeacher.sln

      - name: Build Release with warnings as errors
        run: dotnet build KnolTeacher.sln -c Release --no-restore -warnaserror

      - name: Run tests
        run: dotnet test tests/KnolTeacher.Tests/KnolTeacher.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=knolteacher-rc-tests.trx"

      - name: Validate single-file packaging policy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [xml]$project = Get-Content -LiteralPath "src/KnolTeacher.Desktop/KnolTeacher.Desktop.csproj" -Raw
          $compression = [string]$project.Project.PropertyGroup.EnableCompressionInSingleFile
          if ($compression -ne "true") {
              throw "EnableCompressionInSingleFile must remain true until a measured Windows startup benchmark justifies changing it. Found: $compression"
          }

      - name: Publish RC single-file package
        shell: cmd
        run: publish.bat

      - name: Verify RC package and create manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          [xml]$props = Get-Content -LiteralPath "Directory.Build.props" -Raw
          $developmentVersion = [string]$props.Project.PropertyGroup.KnolTeacherVersion
          $stableVersion = (Get-Content -LiteralPath "release/release-version.txt" -Raw).Trim()

          $files = @(Get-ChildItem -LiteralPath "dist-net" -File -Recurse)
          if ($files.Count -ne 1) {
              throw "dist-net must contain exactly one file. Found: $($files.Count)"
          }

          $exe = $files[0]
          if ($exe.Name -ne "놀티쳐.exe") {
              throw "RC package must use the official local package name 놀티쳐.exe. Found: $($exe.Name)"
          }

          $expectedFileVersion = "$developmentVersion.0"
          $actualFileVersion = $exe.VersionInfo.FileVersion
          if ($actualFileVersion -ne $expectedFileVersion) {
              throw "Embedded FileVersion mismatch. Expected $expectedFileVersion, found $actualFileVersion."
          }

          $actualProductVersion = $exe.VersionInfo.ProductVersion
          if (-not $actualProductVersion.StartsWith($developmentVersion, [System.StringComparison]::Ordinal)) {
              throw "Embedded ProductVersion mismatch. Expected prefix $developmentVersion, found $actualProductVersion."
          }

          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = $exe.Length
          $shortSha = "${{ github.sha }}".Substring(0, 8)
          $artifactName = "KnolTeacher-v$developmentVersion-rc-run${{ github.run_number }}-$shortSha"

          New-Item -ItemType Directory -Path "rc-output" -Force | Out-Null
          @(
              "KnolTeacher Release Candidate Manifest"
              "DevelopmentVersion=$developmentVersion"
              "StableBaseline=$stableVersion"
              "Commit=${{ github.sha }}"
              "WorkflowRun=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              "FileName=$($exe.Name)"
              "FileVersion=$actualFileVersion"
              "ProductVersion=$actualProductVersion"
              "SizeBytes=$size"
              "SHA256=$hash"
              "ManualChecklist=docs/V1_1_RELEASE_REGRESSION_CHECKLIST.md"
          ) | Set-Content -LiteralPath "rc-output/RC_MANIFEST.txt" -Encoding UTF8

          "RC_ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## KnolTeacher v$developmentVersion RC"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Commit: `${{ github.sha }}`"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- FileVersion: `$actualFileVersion`"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Size: `$size bytes`"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- SHA-256: `$hash`"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Manual regression: `docs/V1_1_RELEASE_REGRESSION_CHECKLIST.md`"

          Write-Host "RC artifact: $artifactName"
          Write-Host "SHA-256: $hash"

      - name: Upload RC candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RC_ARTIFACT_NAME }}
          path: |
            dist-net/놀티쳐.exe
            rc-output/RC_MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
